
<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="styles.css">
    <title>Registration Form</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h1>Student Registration Form</h1>

    <p>
        <a href="index.html">Home</a> |
        <a href="form.html">Register</a>
    </p>

    <form action="thanks.html" method="get">

        <label>Full Name:</label><br>
        <input type="text" name="name" required>
        <br><br>

        <label>Registration Number:</label><br>
        <input type="text" name="registration" required>
        <br><br>

        <label>Email:</label><br>
        <input type="email" name="email" required>
        <br><br>

        <label>Phone:</label><br>
        <input type="tel" name="phone" placeholder="03XXXXXXXXX">
        <br><br>

        <label>Age:</label><br>
        <input type="number" name="age" min="16" max="40">
        <br><br>

        <label>Date of Birth:</label><br>
        <input type="date" name="dob">
        <br><br>

        <label>Gender:</label><br>
        <input type="radio" name="gender" value="Male"> Male
        <input type="radio" name="gender" value="Female"> Female
        <br><br>

        <label>Department:</label><br>
        <select name="department">
            <option value="AI">Artificial Intelligence</option>
            <option value="CS">Computer Science</option>
            <option value="SE">Software Engineering</option>
            <option value="EE">Electrical Engineering</option>
        </select>
        <br><br>

        <label>Interests:</label><br>
        <input type="checkbox" name="interest" value="Web"> Web Development
        <br>
        <input type="checkbox" name="interest" value="AI"> Artificial Intelligence
        <br>
        <input type="checkbox" name="interest" value="Games"> Games
        <br><br>

        <label>Address:</label><br>
        <textarea name="address" rows="4"></textarea>
        <br><br>

        <input type="submit" value="Register">
        <input type="reset" value="Clear">

    </form>

</body>
</html>
